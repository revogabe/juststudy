    <dialog id="inspector" aria-labelledby="inspector-title"></dialog>
    <dialog id="focus-session" aria-labelledby="focus-title" lang="en"></dialog>
    <div class="notice" id="notice" role="status" hidden></div>
    <div class="sr-only" id="announcement" role="status" aria-live="polite" lang="en"></div>
