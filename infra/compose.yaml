services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: juststudy
      POSTGRES_USER: juststudy
      POSTGRES_PASSWORD: juststudy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juststudy -d juststudy"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - juststudy-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  juststudy-postgres:
